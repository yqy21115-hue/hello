<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>You and Me</title>
    <style>
        :root {
            --bg: #fff5f8; --panel: #fff; --text: #5c4d4d; --gray: #b3a1a1;
            --pri: #ffa6c9; --other: #fff0f5; --self: #ffb7c5; --line: #ffe3ec; --self-text: #fff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
        
        .phone { 
            width: 100vw; height: 100vh; height: 100dvh; 
            display: flex; flex-direction: column; position: relative; 
            background-image: radial-gradient(#ffe3ec 1px, transparent 1px); background-size: 20px 20px;
        }
        
        /* 顶部状态栏 (绝对居中) */
        .header { 
            height: 80px; display: flex; justify-content: space-between; align-items: center; 
            padding: 0 15px; background: var(--panel); border-bottom: 2px dashed var(--line); 
            flex-shrink: 0; z-index: 10; position: relative;
        }
        .header-center { 
            position: absolute; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
        }
        .avatar { width: 44px; height: 44px; border-radius: 50%; background: #ffe3ec; background-size: cover; display: flex; justify-content: center; align-items: center; font-size: 12px; border: 2px solid #fff; }
        .name { font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 4px;}
        .mood { font-size: 10px; background: var(--pri); color: #fff; padding: 2px 8px; border-radius: 10px; }
        
        .h-btn { color: var(--pri); font-size: 22px; cursor: pointer; }
        .h-btn-left { margin-right: auto; }
        .h-btn-right { margin-left: auto; display: flex; gap: 15px;}

        /* 聊天核心区 */
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg-row { display: flex; width: 100%; align-items: flex-start; }
        
        /* 自己：靠右 */
        .msg-row.self { justify-content: flex-end; }
        .msg-row.self .msg-avatar { margin-left: 8px; order: 2; } 
        .msg-row.self .msg-content { order: 1; display: flex; justify-content: flex-end;} 
        
        /* 对方：靠左 */
        .msg-row.other { justify-content: flex-start; }
        .msg-row.other .msg-avatar { margin-right: 8px; order: 1; } 
        .msg-row.other .msg-content { order: 2; display: flex; justify-content: flex-start;}

        .msg-avatar { width: 38px; height: 38px; border-radius: 50%; background: #ffe3ec; background-size: cover; display: flex; justify-content: center; align-items: center; font-size: 12px; flex-shrink: 0; border: 1px solid #fff;}
        .bubble { padding: 10px 14px; font-size: 15px; max-width: 70vw; word-break: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .msg-row.other .bubble { background: var(--other); border-radius: 16px 16px 16px 4px; }
        .msg-row.self .bubble { background: var(--self); color: var(--self-text); border-radius: 16px 16px 4px 16px; }

        /* 特殊卡片 */
        .card { width: 220px; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 5px; background: linear-gradient(135deg, #ffb347, #ffcc33); color: #fff; }
        .card.self { background: linear-gradient(135deg, #ffa6c9, #ffb7c5); }
        .c-top { font-size: 13px; font-weight: bold; }
        .c-amt { font-size: 20px; font-weight: 800; }
        .c-actions { display: flex; gap: 8px; margin-top: 5px; }
        .c-btn { flex: 1; padding: 6px; border-radius: 6px; border: none; font-weight: bold; font-size: 12px;}
        .c-bt1 { background: #fff; color: #ffa6c9; }
        .c-bt2 { background: rgba(255,255,255,0.3); color: #fff; }
        .let-card { width: 180px; background: var(--panel); border: 2px dashed var(--pri); border-radius: 12px; padding: 12px; color: var(--pri); text-align: center; cursor: pointer; font-weight: bold; }

        /* 底部输入框 */
        .input-area { padding: 10px 15px; padding-bottom: max(10px, env(safe-area-inset-bottom)); background: var(--panel); border-top: 2px dashed var(--line); display: flex; gap: 10px; align-items: center; flex-shrink: 0; z-index: 10;}
        .i-btn { color: var(--pri); font-size: 22px; cursor: pointer; }
        .in-box { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 8px 12px; }
        .in-box input { width: 100%; background: none; border: none; color: var(--text); outline: none; font-size: 15px; }
        .s-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--pri); color: #fff; border: none; cursor: pointer; font-weight: bold;}

        /* 弹窗页 */
        .page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 100; display: none; flex-direction: column; }
        .page.show { display: flex; }
        .p-head { height: 50px; display: flex; align-items: center; padding: 0 15px; color: var(--pri); border-bottom: 1px solid var(--line); cursor: pointer; font-weight: bold; flex-shrink: 0;}
        .p-body { padding: 15px; flex: 1; overflow-y: auto; padding-bottom: max(20px, env(safe-area-inset-bottom));}
        .f-group { margin-bottom: 15px; }
        .f-group label { display: block; font-size: 13px; margin-bottom: 5px; }
        .f-group input, .f-group select, .f-group textarea { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-family: sans-serif; }
        .f-group button { width: 100%; padding: 12px; background: var(--pri); color: #fff; border: none; border-radius: 8px; font-weight: bold; }
        .list-item { background: var(--panel); padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 14px;}

        /* 通话页面 */
        .call-page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 500; display: none; flex-direction: column; align-items: center; justify-content: space-between; padding: 80px 0; padding-bottom: max(80px, env(safe-area-inset-bottom));}
        .call-page.show { display: flex; }
        .c-ring { width: 100px; height: 100px; border-radius: 50%; background: var(--panel); background-size: cover; border: 4px solid #fff; }
        .c-name { font-size: 20px; margin-top: 15px; font-weight: bold;}
        .c-status { color: var(--pri); margin-top: 10px; }
        .c-btns { display: flex; gap: 50px; margin-top: auto; }
        .c-circle { width: 65px; height: 65px; border-radius: 50%; border: none; font-size: 26px; color: #fff; cursor: pointer; }
        .c-red { background: #ff6b81; }
        .c-green { background: #7bed9f; }
        .min-btn { position: absolute; top: 50px; left: 15px; background: var(--panel); padding: 6px 12px; border-radius: 15px; border: 1px solid var(--line); cursor: pointer; }
        
        /* 悬浮窗 */
        .float-call { position: absolute; top: 90px; right: 15px; width: 70px; height: 70px; background: #7bed9f; border-radius: 50%; display: none; flex-direction: column; justify-content: center; align-items: center; color: #fff; font-size: 12px; cursor: move; z-index: 9999; touch-action: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2);}
        .float-call.show { display: flex; }
    </style>
</head>
<body>

<div class="phone">
    <!-- 头部（正中间显示头像名字） -->
    <div class="header">
        <div class="h-btn h-btn-left" onclick="showPage('cardsPage')">⭐</div>
        <div class="header-center" onclick="showPage('moodPage')">
            <div class="avatar" id="topAvatar">TA</div>
            <div class="name" id="topName">小猪 <span style="color:var(--gray);font-size:10px;">〉</span></div>
            <div class="mood" id="topMood">开心</div>
        </div>
        <div class="h-btn-right">
            <span class="h-btn" onclick="triggerCall()">📞</span>
            <span class="h-btn" onclick="showPage('sysPage')">⚙️</span>
        </div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
        <span class="i-btn" onclick="activeCard()">🎲</span>
        <span class="i-btn" onclick="showPage('moneyPage')">💰</span>
        <span class="i-btn" onclick="showPage('letterPage')">✉️</span>
        <div class="in-box"><input type="text" id="msgInput" placeholder="发消息..." onkeydown="if(event.key==='Enter') sendMsg()"></div>
        <button class="s-btn" onclick="sendMsg()">↑</button>
    </div>

    <div class="float-call" id="floatCall">
        <span>通话中</span><span id="floatTimer">00:00</span>
    </div>

    <!-- 角色设定 -->
    <div id="moodPage" class="page">
        <div class="p-head" onclick="hidePage()">〈 返回</div>
        <div class="p-body">
            <div class="f-group"><label>TA的名字</label><input type="text" id="inputName"></div>
            <div class="f-group"><label>我的头像</label><input type="file" accept="image/*" onchange="uploadAv(event, 'self')"></div>
            <div class="f-group"><label>TA的头像</label><input type="file" accept="image/*" onchange="uploadAv(event, 'other')"></div>
            <button onclick="saveMood()">保存设定</button>
        </div>
    </div>

    <!-- 系统设置 -->
    <div id="sysPage" class="page">
        <div class="p-head" onclick="hidePage()">〈 返回</div>
        <div class="p-body">
            <div class="f-group"><label>回复延迟(秒)</label><input type="number" id="setSpeed" value="2"></div>
            <div class="f-group"><label>已读不回率(%)</label><input type="number" id="setIgnore" value="20"></div>
            <button onclick="saveSys()">保存设置</button>
        </div>
    </div>

    <!-- 字卡库（已补全） -->
    <div id="cardsPage" class="page">
        <div class="p-head" onclick="hidePage()">〈 返回</div>
        <div class="p-body">
            <div class="f-group">
                <label>添加新的字卡</label>
                <textarea id="newCard" rows="3" placeholder="输入字卡内容，比如：抱抱你..."></textarea>
                <button onclick="addCard()">+ 添加到字卡库</button>
            </div>
            <div id="cardList" style="margin-top:20px;"></div>
        </div>
    </div>

    <!-- 转账页 -->
    <div id="moneyPage" class="page">
        <div class="p-head" onclick="hidePage()">〈 返回</div>
        <div class="p-body">
            <div class="f-group"><label>金额</label><input type="number" id="mAmt" placeholder="520"></div>
            <div class="f-group"><label>留言</label><input type="text" id="mNote"></div>
            <button onclick="sendMoney()">确认发送</button>
        </div>
    </div>

    <!-- 写信页 -->
    <div id="letterPage" class="page">
        <div class="p-head" onclick="hidePage()">〈 返回</div>
        <div class="p-body">
            <div class="f-group"><label>写一封长信</label><textarea id="lText" rows="6"></textarea><button onclick="sendLetter()">寄出</button></div>
        </div>
    </div>

    <!-- 读信页 -->
    <div id="readPage" class="page">
        <div class="p-head" onclick="hidePage()">〈 返回</div>
        <div class="p-body" style="margin:20px; border:2px dashed var(--pri); border-radius:12px; background:#fff;">
            <h3 id="rTitle" style="color:var(--pri); margin-bottom:10px;"></h3>
            <p id="rText" style="line-height:1.6;"></p>
        </div>
    </div>

    <!-- 通话页 -->
    <div id="callPage" class="call-page">
        <button class="min-btn" id="btnMin" onclick="minCall()" style="display:none;">收起</button>
        <div style="text-align:center;">
            <div class="c-ring" id="callAvatar"></div>
            <div class="c-name" id="callName"></div>
            <div class="c-status" id="callStatus">邀请你语音通话...</div>
        </div>
        <div class="c-btns" id="inBtns">
            <button class="c-circle c-red" onclick="rejectCall()">✕</button>
            <button class="c-circle c-green" onclick="acceptCall()">📞</button>
        </div>
        <div class="c-btns" id="outBtns" style="display:none;">
            <button class="c-circle c-red" onclick="endCall()">✕</button>
        </div>
    </div>
</div>

<script>
    let chat = JSON.parse(localStorage.getItem('c_data_v27')) || [];
    let cards = JSON.parse(localStorage.getItem('c_cards_v27')) || ['汪', '好喜欢你', '抱抱你', '我想你了'];
    let prof = JSON.parse(localStorage.getItem('c_prof_v27')) || { name:'小猪', avatarOther:'', avatarSelf:'' };
    let cfg = JSON.parse(localStorage.getItem('c_cfg_v27')) || { speed:2, ignore:20 };
    let callInt = null, callTimeout = null, isCalling = false;

    window.onload = () => {
        ui(); render(); renderCards();
        document.getElementById('inputName').value = prof.name;
        document.getElementById('setSpeed').value = cfg.speed;
        document.getElementById('setIgnore').value = cfg.ignore;
        setInterval(bgLoop, 15000);
    };

    const save = () => {
        localStorage.setItem('c_data_v27', JSON.stringify(chat));
        localStorage.setItem('c_cards_v27', JSON.stringify(cards));
        localStorage.setItem('c_prof_v27', JSON.stringify(prof));
        localStorage.setItem('c_cfg_v27', JSON.stringify(cfg));
    };

    const ui = () => {
        document.getElementById('topName').innerHTML = prof.name + ' <span style="color:var(--gray);font-size:10px;">〉</span>';
        document.getElementById('callName').innerText = prof.name;
        if(prof.avatarOther) {
            document.getElementById('topAvatar').style.backgroundImage = `url(${prof.avatarOther})`;
            document.getElementById('topAvatar').innerText = '';
            document.getElementById('callAvatar').style.backgroundImage = `url(${prof.avatarOther})`;
        }
    };

    const showPage = (id) => { document.getElementById(id).classList.add('show'); };
    const hidePage = () => { document.querySelectorAll('.page').forEach(p=>p.classList.remove('show')); if(isCalling) document.getElementById('floatCall').classList.add('show'); };

    const render = () => {
        const box = document.getElementById('chatBox');
        box.innerHTML = chat.map((m, i) => {
            let avatarImg = m.isSelf ? prof.avatarSelf : prof.avatarOther;
            let avatarHtml = `<div class="msg-avatar" style="background-image:url('${avatarImg}')">${avatarImg ? '' : (m.isSelf ? '我':'TA')}</div>`;
            let contentHtml = '';
            
            if(m.type === 'transfer') {
                let st = m.status==='accepted'?'已收款':(m.status==='rejected'?'已退回':'待收款');
                let btns = (!m.isSelf && m.status==='pending') ? `<div class="c-actions"><button class="c-btn c-bt2" onclick="handleMoney(${i},'rejected')">退还</button><button class="c-btn c-bt1" onclick="handleMoney(${i},'accepted')">接收</button></div>` : '';
                contentHtml = `<div class="card ${m.isSelf?'self':''}"><div class="c-top">💰 转账</div><div class="c-amt">¥ ${m.text}.00</div>${m.note?`<div>“${m.note}”</div>`:''}<div style="font-size:12px;">${st}</div>${btns}</div>`;
            } else if(m.type === 'letter') {
                contentHtml = `<div class="let-card" onclick="readLetter(${i})">✉️ 信件</div>`;
            } else if(m.type === 'reply') {
                contentHtml = `<div class="let-card" onclick="readLetter(${i})">💌 回信</div>`;
            } else {
                contentHtml = `<div class="bubble">${m.text}</div>`;
            }
            return `<div class="msg-row ${m.isSelf?'self':'other'}">${avatarHtml}<div class="msg-content">${contentHtml}</div></div>`;
        }).join('');
        box.scrollTop = box.scrollHeight;
    };

    const sendMsg = () => {
        let v = document.getElementById('msgInput').value.trim();
        if(!v) return;
        chat.push({ text:v, isSelf:true }); document.getElementById('msgInput').value='';
        save(); render();
        if(Math.random()*100 < cfg.ignore) return;
        autoReply();
    };

    const autoReply = () => {
        setTimeout(() => {
            let reply = cards[Math.floor(Math.random()*cards.length)];
            chat.push({ text:reply, isSelf:false }); save(); render();
            if(Math.random() > 0.7) triggerCall();
        }, cfg.speed*1000);
    };

    const activeCard = () => {
        let reply = cards[Math.floor(Math.random()*cards.length)];
        chat.push({ text:reply, isSelf:false }); save(); render();
    };

    const bgLoop = () => {
        if(!isCalling && Math.random() < 0.2) {
            let reply = cards[Math.floor(Math.random()*cards.length)];
            chat.push({ text:reply, isSelf:false }); save(); render();
        }
    };

    const sendMoney = () => {
        let a = document.getElementById('mAmt').value, n = document.getElementById('mNote').value;
        if(!a) return alert('请输入金额');
        chat.push({ text:a, isSelf:true, type:'transfer', note:n, status:'pending' });
        save(); hidePage(); render();
        setTimeout(() => {
            let m = chat[chat.length-1];
            if(Math.random()<0.3) { m.status='rejected'; chat.push({ text:'退给你啦~', isSelf:false }); }
            else { m.status='accepted'; chat.push({ text:'谢谢宝贝！', isSelf:false }); }
            save(); render();
        }, 1500);
    };

    const handleMoney = (i, st) => { chat[i].status = st; save(); render(); };

    const sendLetter = () => {
        let t = document.getElementById('lText').value.trim();
        if(!t) return alert('不能为空');
        chat.push({ text:t, isSelf:true, type:'letter' }); save(); hidePage(); render();
        setTimeout(() => {
            chat.push({ text:cards[Math.floor(Math.random()*cards.length)], isSelf:false, type:'reply' });
            save(); render();
        }, Math.random()*10000 + 3000);
    };

    const readLetter = (i) => {
        let m = chat[i];
        document.getElementById('rTitle').innerText = m.isSelf ? '我的信' : 'TA的回信';
        document.getElementById('rText').innerText = m.text;
        showPage('readPage');
    };

    const triggerCall = () => {
        showPage('callPage'); isCalling = true;
        document.getElementById('inBtns').style.display = 'flex';
        document.getElementById('outBtns').style.display = 'none';
        document.getElementById('btnMin').style.display = 'none';
        document.getElementById('callStatus').innerText = '邀请你语音通话...';
        callTimeout = setTimeout(rejectCall, 10000);
    };

    const rejectCall = () => {
        clearTimeout(callTimeout); chat.push({ text:'未接来电', isSelf:false }); save(); endCallClean(); hidePage(); render();
    };

    const acceptCall = () => {
        clearTimeout(callTimeout);
        document.getElementById('inBtns').style.display = 'none';
        document.getElementById('outBtns').style.display = 'flex';
        document.getElementById('btnMin').style.display = 'block';
        let s = 0;
        document.getElementById('callStatus').innerText = '00:00';
        callInt = setInterval(() => {
            s++;
            let str = `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
            document.getElementById('callStatus').innerText = str;
            document.getElementById('floatTimer').innerText = str;
        }, 1000);
    };

    const endCall = () => {
        chat.push({ text:'你挂断了通话', isSelf:true }); save(); endCallClean(); hidePage(); render();
    };

    const endCallClean = () => {
        isCalling = false; clearInterval(callInt);
        document.getElementById('callPage').classList.remove('show');
        document.getElementById('floatCall').classList.remove('show');
    };

    const minCall = () => {
        document.getElementById('callPage').classList.remove('show');
        document.getElementById('floatCall').classList.add('show');
    };

    const saveMood = () => {
        let n = document.getElementById('inputName').value;
        if(n) prof.name = n;
        save(); ui(); hidePage();
    };

    const uploadAv = (e, type) => {
        let r = new FileReader();
        r.onload = (ev) => { 
            if(type === 'self') prof.avatarSelf = ev.target.result;
            else prof.avatarOther = ev.target.result;
            save(); ui(); 
        };
        if(e.target.files[0]) r.readAsDataURL(e.target.files[0]);
    };

    const saveSys = () => {
        cfg.speed = parseInt(document.getElementById('setSpeed').value) || 2;
        cfg.ignore = parseInt(document.getElementById('setIgnore').value) || 20;
        save(); hidePage();
    };

    const renderCards = () => {
        document.getElementById('cardList').innerHTML = cards.map((c,i) => `
            <div class="list-item">
                <span style="padding-right:10px;">${c}</span>
                <button style="color:#ff6b81; border:none; background:none; cursor:pointer;" onclick="delCard(${i})">删除</button>
            </div>
        `).join('');
    };

    const addCard = () => {
        let v = document.getElementById('newCard').value.trim();
        if(!v) return; cards.push(v); document.getElementById('newCard').value = '';
        save(); renderCards();
        alert('字卡添加成功！');
    };

    const delCard = (i) => { cards.splice(i,1); save(); renderCards(); };

    // 悬浮窗拖拽
    let isDragging = false, hasMoved = false, dragX = 0, dragY = 0;
    const floatEl = document.getElementById('floatCall');
    const callPageEl = document.getElementById('callPage');

    const startDrag = (e) => {
        if(!floatEl.classList.contains('show')) return;
        hasMoved = false;
        let cx = e.touches ? e.touches[0].clientX : e.clientX;
        let cy = e.touches ? e.touches[0].clientY : e.clientY;
        let rect = floatEl.getBoundingClientRect();
        dragX = cx - rect.left; dragY = cy - rect.top;
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('touchmove', onDrag, {passive: false});
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);
    };
    const onDrag = (e) => {
        if (e.cancelable) e.preventDefault(); 
        hasMoved = true;
        let cx = e.touches ? e.touches[0].clientX : e.clientX;
        let cy = e.touches ? e.touches[0].clientY : e.clientY;
        let x = cx - dragX, y = cy - dragY;
        let mx = window.innerWidth - floatEl.offsetWidth, my = window.innerHeight - floatEl.offsetHeight;
        if(x < 0) x = 0; if(y < 0) y = 0; if(x > mx) x = mx; if(y > my) y = my;
        floatEl.style.left = x + 'px'; floatEl.style.top = y + 'px'; floatEl.style.right = 'auto'; 
    };
    const endDrag = () => {
        document.removeEventListener('mousemove', onDrag);
        document.removeEventListener('touchmove', onDrag);
        document.removeEventListener('mouseup', endDrag);
        document.removeEventListener('touchend', endDrag);
    };

    floatEl.addEventListener('touchstart', startDrag);
    floatEl.addEventListener('mousedown', startDrag);
    floatEl.addEventListener('click', () => {
        if(!hasMoved) { floatEl.classList.remove('show'); callPageEl.classList.add('show'); }
    });
</script>
</body>
</html>
